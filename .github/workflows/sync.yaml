# Daily: package what's in plugins.toml and not yet on the channel, test it, upload it.
# The channel is the state (no state in the repository), so a failed or repeated run
# just picks up where the last one stopped.
#
# One-off setup:
# - Repository variable QSTACK_CHANNEL: the target channel URL, e.g.
#   https://prefix.dev/qstack-test (use a test channel first). Without it this
#   workflow does nothing.
# - On prefix.dev, in the channel's settings, add this repository and the workflow
#   file `sync.yaml` as a trusted publisher. Uploads then authenticate with GitHub's
#   OIDC token; no API key is stored.
name: Sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and test, but don't upload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.QSTACK_CHANNEL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    env:
      CHANNEL: ${{ vars.QSTACK_CHANNEL }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          locked: true
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch the plugins.qgis.org feeds
        run: pixi run qp feed

      - name: Plan
        run: |
          {
            echo "## Packages not yet on $CHANNEL"
            pixi run qp plan --channel "$CHANNEL"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A plugin that needs an override (licence, version, ...) mustn't block the
      # others: carry on, and fail the run at the end.
      - name: Generate recipes
        id: generate
        continue-on-error: true
        run: pixi run qp generate

      - name: Build and test
        id: build
        continue-on-error: true
        run: pixi run qp build --channel "$CHANNEL"

      - name: Validate packages
        run: |
          if compgen -G "output/noarch/qgis-plugin-*.conda" > /dev/null; then
            pixi run qp validate
          else
            echo "Nothing built."
          fi

      - name: Upload
        if: ${{ !inputs.dry-run }}
        run: pixi run qp upload --channel "$CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if a plugin failed
        if: steps.generate.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "::error::Some plugins failed to generate or build; see those steps' logs."
          exit 1
