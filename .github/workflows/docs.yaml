# Build the docs site on pull requests; build and deploy it to GitHub Pages from main.
# One-off setup: Settings → Pages → Source: "GitHub Actions". Set the repository
# variable QSTACK_CHANNEL (e.g. https://prefix.dev/qstack) once the channel is
# published; until then the plugin catalogue is empty.
name: Docs

on:
  push:
    branches: [main]
    paths: &paths
      - docs/**
      - tools/**
      - plugins.toml
      - pixi.toml
      - pixi.lock
      - .github/workflows/docs.yaml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default docs
          locked: true
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}

      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0

      - name: Catalogue data from the channel
        env:
          CHANNEL: ${{ vars.QSTACK_CHANNEL || 'output' }}
        run: pixi run docs-data "$CHANNEL"

      - name: Check
        run: pixi run docs-check

      - name: Build
        env:
          # Empty on pull requests: the site is built for the root path.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pixi run docs-build

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
