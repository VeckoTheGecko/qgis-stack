# Pull requests (and main): checks that lefthook runs locally, plus building and testing
# the packages a merge would publish. Nothing is uploaded.
name: PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Build every plugin, not only those missing from the channel
        type: boolean
        default: false

env:
  # The prefix.dev channel packages are published to (the test channel for now).
  QSTACK_CHANNEL: https://prefix.dev/veckothegecko/qgis-stack-test

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds -o pipefail, so `qp ... | tee` fails when qp does.
    shell: bash

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          locked: true # pixi.lock must match pixi.toml
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: pixi run lint

      - name: Unit tests
        run: pixi run test

      - name: plugins.schema.json is up to date
        run: |
          pixi run schema
          git diff --exit-code plugins.schema.json

      - name: qp check
        run: pixi run qp check --channel "$QSTACK_CHANNEL"

  plugins:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # With the "all" input, every plugin is built, not only those missing from the channel.
      ALL: ${{ inputs.all || false }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          locked: true
          cache: true
          cache-write: false

      - name: Plan
        if: env.ALL != 'true'
        run: pixi run qp plan --channel "$QSTACK_CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate recipes
        run: pixi run qp generate

      - name: Build and test
        run: |
          if [ "$ALL" = true ]; then
            pixi run qp build
          else
            pixi run qp build --channel "$QSTACK_CHANNEL"
          fi

      - name: Validate packages
        run: |
          if compgen -G "output/noarch/qgis-plugin-*.conda" > /dev/null; then
            pixi run qp validate
          else
            echo "Nothing to build: every package is already on $QSTACK_CHANNEL."
          fi
