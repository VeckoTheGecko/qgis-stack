#:schema ./plugins.schema.json
# The plugins to package: one [plugins.<slug>] table each, keyed by the slug on
# plugins.qgis.org (exact, case-sensitive), sorted case-insensitively (`qp add` keeps
# the order). Overrides patch what the plugin's own metadata gets wrong or leaves out;
# see docs/plan.md section 6.

[settings]
# QGIS lines whose plugins.qgis.org feed is read. Each feed only lists the newest
# version of every plugin compatible with that line, so several lines are needed to
# see the versions users of older QGIS get.
feed_lines = ["3.40", "3.44", "4.0", "4.2"]
# QGIS lines on conda-forge that packages are tested against: the oldest one inside a
# plugin's range, plus the newest QGIS. (conda-forge has no 4.0 builds.)
test_lines = ["3.40", "3.44", "4.2"]
include_experimental = false

[plugins.DataPlotly]
add_run = ["plotly", "pandas"]
test.commands = ["python -c 'import plotly, pandas'"]
note = "imports plotly and pandas at load time and doesn't bundle them"

[plugins.latlontools]

[plugins.mmqgis]
license = "GPL-2.0-only"
note = "LICENSE is a short notice: 'under the terms of version 2 of the GNU General Public License'"

[plugins.profiletool]

[plugins.qfieldsync]

[plugins.Qgis2threejs]

[plugins.qgis2web]

[plugins.quick_map_services]

[plugins.QuickOSM]

[plugins.shapetools]
