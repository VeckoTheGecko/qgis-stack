[workspace]
name = "qgis-plugin-pipeline"
description = "Conda packages for QGIS plugins from plugins.qgis.org (QStack; see docs/src/content/docs/maintainers/plan.md)"
authors = ["Vecko <36369090+VeckoTheGecko@users.noreply.github.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = "3.14.*"
pytest = ">=9,<10"
ruff = "*"
lefthook = ">=2.2,<3"
rattler-build = ">=0.77.0,<0.78"
pyyaml = ">=6.0.3,<7"
pydantic = ">=2.14,<3"
hypothesis = ">=6.170,<7"
packaging = ">=26"
py-rattler = ">=0.28.0,<0.29"

[pypi-dependencies]
# The pipeline tool (`qp`), from tools/.
qgis-plugin-pipeline = { path = "tools", editable = true }

[tasks]
test = { cmd = "pytest tools/tests", description = "Unit tests of the pipeline tool (offline)" }
test-network = { cmd = "pytest tools/tests -m network", description = "Tests that download from plugins.qgis.org (golden recipe)" }
lint = { cmd = "ruff check tools && ruff format --check tools", description = "Lint and format-check tools/" }
fmt = { cmd = "ruff check --fix tools && ruff format tools", description = "Fix lint issues and format tools/" }
install-hooks = { cmd = "lefthook install", description = "Install the git hooks from lefthook.yml" }
docs-data = { cmd = "qp catalogue --channel {{ channel }}", args = [{ arg = "channel", default = "output" }], description = "Write the docs site's plugin table from a channel (URL or local dir; default: output/)" }
schema = { cmd = "qp schema -o plugins.schema.json", description = "Regenerate plugins.schema.json (editor completion for plugins.toml) from tools/qp/config.py" }

[feature.docs.dependencies]
nodejs = ">=24,<27"
pnpm = ">=12,<13"

[feature.docs.tasks]
docs-install = { cmd = "pnpm install --frozen-lockfile", cwd = "docs", inputs = ["docs/package.json", "docs/pnpm-lock.yaml"], outputs = ["docs/node_modules/.modules.yaml"], description = "Install the docs site's Node dependencies" }
docs-dev = { cmd = "pnpm dev", cwd = "docs", depends-on = ["docs-install"], description = "Serve the docs site locally with live reload" }
docs-build = { cmd = "pnpm build", cwd = "docs", depends-on = ["docs-install"], description = "Build the docs site into docs/dist/" }
docs-check = { cmd = "pnpm check", cwd = "docs", depends-on = ["docs-install"], description = "Type-check the docs site and check its formatting" }
docs-fmt = { cmd = "pnpm format", cwd = "docs", depends-on = ["docs-install"], description = "Format the docs site with prettier" }

[environments]
# Node only, so the pipeline env stays small.
docs = { features = ["docs"], no-default-feature = true }
