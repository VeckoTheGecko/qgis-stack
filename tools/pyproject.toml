[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qgis-stack-tools"
version = "0.0.0"
description = "Generate, build and publish conda packages for QGIS plugins"
requires-python = ">=3.14"
dependencies = ["pydantic>=2", "pyyaml"]

[project.scripts]
qp = "qp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["qp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# QgsApplication must be initialised before qgis.utils is imported.
"qp/templates/test_plugin.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = ["network: needs plugins.qgis.org (run with `pixi run test-network`)"]
addopts = "-m 'not network'"
