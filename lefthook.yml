# Git hooks; install with `pixi run install-hooks`. Commands run in the pixi environment.
pre-commit:
  commands:
    # Sequential on purpose: both rewrite the same files.
    ruff-check:
      priority: 1
      glob: "tools/**/*.py"
      run: pixi run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      priority: 2
      glob: "tools/**/*.py"
      run: pixi run ruff format {staged_files}
      stage_fixed: true
    # plugins.schema.json is generated from the plugins.toml models.
    schema:
      priority: 3
      glob: "tools/qp/config.py"
      run: pixi run schema
      stage_fixed: true
    pixi-lock:
      glob: "{pixi.toml,tools/pyproject.toml}"
      run: pixi lock --check
    prettier:
      root: "docs/"
      glob: "docs/**"
      exclude: "docs/pnpm-lock.yaml"
      run: pixi run -e docs pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  commands:
    test:
      run: pixi run test
    # Type-checks the site, and the build fails on broken internal links.
    docs:
      glob: "docs/**"
      run: pixi run docs-check && pixi run docs-build
